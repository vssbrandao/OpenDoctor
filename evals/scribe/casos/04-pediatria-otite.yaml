falas:
- - m
  - Oi, mãe. O que está acontecendo com o Lucas?
- - a
  - Ele está com febre desde ontem, chegou a 38 e meio, e chorando com dor no ouvido direito.
- - m
  - Teve vômito, diarreia ou falta de ar?
- - a
  - Não. Só está mais molinho e comendo pouco.
- - m
  - Ele pesa 16 quilos. Temperatura agora 38,2. O ouvido direito está vermelho e abaulado. O esquerdo normal. Garganta e pulmões sem alterações.
- - m
  - 'É uma otite média aguda. Vou passar amoxicilina 250 miligramas por 5 ml: 8 ml de 12 em 12 horas por 10 dias.'
- - m
  - 'Para febre ou dor, paracetamol gotas: 16 gotas até de 6 em 6 horas, se precisar.'
- - a
  - E se a febre não baixar?
- - m
  - Se continuar com febre depois de 48 horas de antibiótico, ou ficar prostrado, volte antes. Retorno em 10 dias.
