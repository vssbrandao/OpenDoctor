falas:
- - p
  - Doutor, estou com falta de ar desde ontem, chiando muito. O spray não está resolvendo.
- - m
  - Quantas vezes usou a bombinha hoje?
- - p
  - Umas seis vezes. Peguei uma gripe semana passada.
- - m
  - Saturação 93 por cento, frequência respiratória 24, frequência cardíaca 104. Sibilos nos dois pulmões.
- - m
  - Vamos fazer agora salbutamol, quatro jatos a cada 20 minutos, três vezes, com espaçador.
- - m
  - 'Depois das três séries: saturação 97 por cento, sibilos bem menores.'
- - m
  - 'Para casa: prednisolona 40 miligramas uma vez ao dia por cinco dias. E vamos começar budesonida com formoterol, dois jatos de 12 em 12 horas, todos os dias.'
- - m
  - Se piorar a falta de ar ou a boca ficar roxa, vá ao pronto-socorro. Retorno em uma semana.
