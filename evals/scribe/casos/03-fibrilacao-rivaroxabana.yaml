falas:
- - m
  - Seu Antônio, o que trouxe o senhor aqui hoje?
- - p
  - Coração disparando, doutora, faz uma semana. Umas palpitações, e canso mais para subir escada.
- - m
  - Teve desmaio, dor no peito ou falta de ar deitado?
- - p
  - Não, nada disso.
- - m
  - O pulso está irregular, frequência 112. Pressão 138 por 86. O eletro mostra fibrilação atrial.
- - m
  - Vou começar a rivaroxabana 20 miligramas, uma vez ao dia, junto com o jantar, para prevenir derrame.
- - m
  - Com ela, o senhor para o AAS. E vou começar o metoprolol succinato 50 miligramas uma vez ao dia para controlar o coração.
- - m
  - O anlodipino continua. Vou pedir ecocardiograma, TSH e função dos rins.
- - p
  - Esse remédio de afinar o sangue pode dar sangramento?
- - m
  - Pode. Se tiver sangramento que não para, fezes pretas ou urina com sangue, procure o pronto-socorro. Retorno em quatro semanas.
