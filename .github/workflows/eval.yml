name: Eval do assistente

# Gate de regressão do assistente (spec §6.2). Gasta créditos da OpenAI, então só roda quando muda
# algo que o eval mede: prompts, busca/síntese/validação, evals, fontes ou dependências.
# (server.py fica de fora: o eval chama search/synthesize direto, não passa pelo servidor.)
on:
  push:
    branches: [main]
    paths:
      - "prompts/**"
      - "evals/**"
      - "app/search.py"
      - "app/synthesize.py"
      - "app/validate.py"
      - "app/llm.py"
      - "app/embeddings.py"
      - "app/pubmed.py"
      - "app/tools.py"
      - "app/chunking.py"
      - "app/topics.py"
      - "app/config.py"
      - "app/eval.py"
      - "sources.yaml"
      - "requirements.txt"
      - ".github/workflows/eval.yml"
  pull_request:
    paths:
      - "prompts/**"
      - "evals/**"
      - "app/search.py"
      - "app/synthesize.py"
      - "app/validate.py"
      - "app/llm.py"
      - "app/embeddings.py"
      - "app/pubmed.py"
      - "app/tools.py"
      - "app/chunking.py"
      - "app/topics.py"
      - "app/config.py"
      - "app/eval.py"
      - "sources.yaml"
      - "requirements.txt"
      - ".github/workflows/eval.yml"
  workflow_dispatch:      # rodar à mão (Actions → Eval do assistente → Run workflow)

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}     # só leitura da base de conhecimento
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Eval — gate de regressão (só com secrets)
        if: ${{ env.OPENAI_API_KEY != '' && env.DATABASE_URL != '' }}
        run: python -m app.eval --check --no-history
