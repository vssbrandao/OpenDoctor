name: CI

# Testes rodam em todo push (o Render só publica depois que passam).
# O eval do assistente (gasta OpenAI) fica em eval.yml e só roda quando o código do assistente muda.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "prompts/**"
      - "app/**"
      - "evals/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # requirements.txt + numpy (testes da avaliação da gravação)

      - name: Testes (sempre; sem banco e sem OpenAI — tests/conftest.py garante)
        run: python -m pytest tests/ -q
