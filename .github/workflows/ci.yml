name: CI

# Testes rodam sempre. O eval (gate de regressão) roda quando os secrets existem.
# Dispara em PRs que tocam prompt, código do RAG, evals ou dependências (spec §6.2).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "prompts/**"
      - "app/**"
      - "evals/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testes unitários (sempre)
        run: python -m pytest tests/ -q

      - name: Eval — gate de regressão (só com secrets)
        if: ${{ env.OPENAI_API_KEY != '' && env.DATABASE_URL != '' }}
        run: python -m app.eval --check --no-history
