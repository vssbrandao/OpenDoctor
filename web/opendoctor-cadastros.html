<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenDoctor | Cadastros</title>
  <style>
    @font-face{font-family:"Helvetica Now Display";font-weight:400;font-style:normal;font-display:swap;
      src:url("assets/fonts/HelveticaNowDisplay-Regular.woff2") format("woff2");}
    @font-face{font-family:"Helvetica Now Display";font-weight:500;font-style:normal;font-display:swap;
      src:url("assets/fonts/HelveticaNowDisplay-Medium.woff2") format("woff2");}
    :root{--disp:"Helvetica Now Display","Helvetica Neue",Helvetica,Arial,sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#fff;color:#0C0C0D;-webkit-font-smoothing:antialiased;font-family:var(--disp);font-weight:500}
    /* página dos administradores (ADMIN_EMAILS): mesmo visual da tela de login, sem design próprio no Figma */
    .wrap{max-width:760px;margin:0 auto;padding:60px 24px 80px}
    .logo{display:block}
    .head{margin-top:82px;display:flex;flex-direction:column;gap:12px}
    .title{font-size:24px;line-height:1.15;color:#0C0C0D}
    .sub{font-size:14px;line-height:1.4;color:#7D7D82}
    .sub a,.card a{color:inherit;text-decoration:underline;text-underline-offset:2px}
    .list{margin-top:40px;display:flex;flex-direction:column;gap:8px}
    .card{background:#F4F4F6;border-radius:24px;padding:24px 32px;display:flex;align-items:center;gap:24px}
    .info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
    .nome{font-size:16px;line-height:1.3;color:#0C0C0D;overflow-wrap:anywhere}
    .meta{font-size:14px;line-height:1.4;color:#6B6B70}
    .warn{font-size:14px;line-height:1.4;color:#D93025}
    .acts{display:flex;gap:8px;flex:none}
    .btn{height:48px;padding:0 24px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;
      font-family:var(--disp);font-weight:500;font-size:14px;line-height:1.4;white-space:nowrap}
    .btn-dark{border:0;background:#10132C;color:#fff}
    .btn-dark:hover{background:#1B1F3F}
    .btn-line{border:1px solid rgba(26,26,26,.16);background:#fff;color:#000}
    .btn-line:hover{background:#F7F8F8}
    .btn:disabled{opacity:.6;cursor:default}
    .btn:focus-visible{outline:2px solid #0B57D0;outline-offset:2px}
    .msg{margin-top:24px;font-size:14px;line-height:1.4;color:#3C3C40}
    .msg.err{color:#D93025}
    [hidden]{display:none!important}
    @media (max-width:640px){.card{flex-direction:column;align-items:stretch}.acts{justify-content:flex-end}}
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="assets/login/logo.svg" width="24" height="24" alt="OpenDoctor">
    <div class="head">
      <h1 class="title">Cadastros para conferir</h1>
      <p class="sub">Médicos que criaram conta e esperam a conferência do CRM. Confira o nome, o número e a situação na
        <a href="https://portal.cfm.org.br/busca-medicos/" target="_blank" rel="noopener noreferrer">busca de médicos do CFM</a>
        antes de aprovar.</p>
    </div>
    <p class="msg" id="msg" role="status">Carregando…</p>
    <div class="list" id="list"></div>
  </main>
  <script>
    (function () {
      var list = document.getElementById('list'), msg = document.getElementById('msg');
      function say(t, err) { msg.textContent = t || ''; msg.hidden = !t; msg.classList.toggle('err', !!err); }
      function data(iso) {
        var d = iso ? new Date(iso) : null;
        return d && !isNaN(d) ? d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
      }
      function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
      function post(url, body) {
        return fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); });
      }
      function card(p) {
        var c = el('div', 'card'), info = el('div', 'info');
        info.appendChild(el('div', 'nome', p.name || '(sem nome)'));
        info.appendChild(el('div', 'meta', 'CRM ' + (p.crm || '?') + '/' + (p.crm_uf || '?') + ' · pediu em ' + data(p.pedido_em)));
        if (p.outras_contas) info.appendChild(el('div', 'warn', 'Atenção: ' + (p.outras_contas === 1 ? 'outra conta já usa' : p.outras_contas + ' outras contas já usam') + ' este CRM.'));
        var acts = el('div', 'acts'), sim = el('button', 'btn btn-dark', 'Aprovar'), nao = el('button', 'btn btn-line', 'Recusar');
        sim.type = nao.type = 'button';
        function decide(aprovar) {
          if (!aprovar && !window.confirm('Recusar o cadastro de ' + (p.name || 'este médico') + '? Ele recebe um e-mail e a conta não é liberada.')) return;
          sim.disabled = nao.disabled = true; say('');
          post('/admin/cadastros/' + (aprovar ? 'aprovar' : 'recusar'), { id: p.id }).then(function (res) {
            if (res.ok || res.j.error === 'nao_pendente') {
              c.remove();
              say((res.ok ? (aprovar ? 'Aprovado.' : 'Recusado.') + (res.j.email_enviado ? ' O médico recebeu um e-mail.' : ' O e-mail ao médico não foi enviado.')
                          : 'Este cadastro já tinha sido decidido.') + (list.children.length ? '' : ' Nenhum outro cadastro esperando.'));
              return;
            }
            sim.disabled = nao.disabled = false; say('Não foi possível salvar. Tente de novo.', true);
          }).catch(function () { sim.disabled = nao.disabled = false; say('Sem conexão. Tente de novo.', true); });
        }
        sim.addEventListener('click', function () { decide(true); });
        nao.addEventListener('click', function () { decide(false); });
        acts.appendChild(nao); acts.appendChild(sim);
        c.appendChild(info); c.appendChild(acts);
        return c;
      }
      fetch('/admin/cadastros', { credentials: 'same-origin' })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
        .then(function (res) {
          if (res.status === 403) { say('Esta página é só para os administradores do OpenDoctor.'); return; }
          if (!res.ok) { say('Não foi possível carregar os cadastros.', true); return; }
          var ps = res.j.pendentes || [];
          say(ps.length ? '' : 'Nenhum cadastro esperando.');
          ps.forEach(function (p) { list.appendChild(card(p)); });
        })
        .catch(function () { say('Sem conexão. Tente de novo.', true); });
    })();
  </script>
</body>
</html>
