<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <title>OpenDoctor | Integrações (Figma 973-6411)</title>
  <style>
    @font-face{font-family:"Helvetica Now Display";font-weight:400;font-style:normal;font-display:swap;
      src:url("assets/fonts/HelveticaNowDisplay-Regular.woff2") format("woff2");}
    @font-face{font-family:"Helvetica Now Display";font-weight:500;font-style:normal;font-display:swap;
      src:url("assets/fonts/HelveticaNowDisplay-Medium.woff2") format("woff2");}
    @font-face{font-family:"Helvetica Now Display";font-weight:700;font-style:normal;font-display:swap;
      src:url("assets/fonts/HelveticaNowDisplay-Bold.woff2") format("woff2");}
    :root{
      --disp:"Helvetica Now Display","Helvetica Neue",Helvetica,Arial,sans-serif;
      --ink:#071216; --muted:#666c6f; --sb-border:rgba(0,0,0,.08);
      --active:#f7f8f8; --card-border:rgba(26,26,26,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:#fff}
    svg{display:block}
    .stage{position:relative;display:flex;width:100%;height:100%;background:#fff;
      font-family:var(--disp);color:var(--ink);overflow:hidden}

    /* ===== LEFT SIDEBAR (268) ===== */
    .nav{flex:none;width:268px;height:100%;background:#fff;position:relative;
      border-right:1px solid var(--sb-border);overflow:hidden}
    .nav-top svg{width:268px;height:52px;display:block}
    /* botão do painel (Figma IconButton 36x36 em x 226, y 8; ícone 20x20 no centro) */
    .nav-toggle{position:absolute;top:8px;right:6px;width:36px;height:36px;border:0;padding:0;
      background:none;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}
    .nav-toggle:hover{background:rgba(0,0,0,.05)}
    .nav-top .nav-toggle svg{width:20px;height:20px;flex:none}
    .nav:not(.collapsed) .nav-toggle svg{visibility:hidden}   /* o ícone já está desenhado no topo */
    /* menu retraído (Figma 1012:7520): faixa de 52px, só ícones, botão do painel em x 8, y 8 */
    .nav.collapsed{width:52px}
    .nav.collapsed .nav-top svg.nav-logo{visibility:hidden}
    .nav.collapsed .nav-toggle{left:8px;right:auto}
    .nav.collapsed .item>span:not(.ico){display:none}
    .nav.collapsed .item{width:40px}
    .nav-main{padding:0 6px;display:flex;flex-direction:column;gap:42px}
    .nav-sec{display:flex;flex-direction:column;gap:4px}
    .item{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:100px;cursor:pointer;
      font-family:var(--disp);font-weight:500;font-size:14px;line-height:20px;color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item:hover{background:var(--active);border-radius:10px}
    .item.active{background:var(--active);border-radius:10px}
    .item .ico{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center}
    .item .ico svg{display:block}

    /* ===== CENTER: INTEGRAÇÃO (Figma 973:6411 → frame 1001:7840: x 586, y 42, w 516) ===== */
    /* padding-right 20px: em 1440px a coluna fica em x=586, como no Figma */
    .center{flex:1;min-width:0;height:100%;overflow-y:auto;display:flex;justify-content:center;
      padding:42px 20px 0 0}
    .int{width:516px;flex:none;display:flex;flex-direction:column;gap:42px;
      align-self:flex-start;padding-bottom:42px}   /* respiro de 42 depois do último cartão: a coluna tem a altura do conteúdo (esticada, os cartões passavam por fora dela e o respiro não entrava na rolagem) */
    .int-title{font-family:var(--disp);font-weight:500;font-size:18px;line-height:24px;color:#071216}   /* título da página: 18 (pedido do usuário) */
    .int-list{display:flex;flex-direction:column;gap:8px}

    /* card (1001:7836): padding 42 + borda 1px (a borda conta no layout, como no Figma), h 369, raio 40 */
    .int-card{height:369px;padding:42px;border-radius:40px;border:1px solid var(--card-border);
      display:flex;flex-direction:column;gap:10px}
    .card-inner{width:431px;display:flex;flex-direction:column;gap:48px}
    .card-head{width:339px;display:flex;flex-direction:column}
    .card-name{font-family:var(--disp);font-weight:500;font-size:14px;line-height:20px;color:#071216}
    .card-sub{font-family:var(--disp);font-weight:500;font-size:14px;line-height:20px;color:#666C6F;width:273px}

    /* campo (973:6646): padding 24, gap 24, raio 24 */
    .conn-row{height:84px;padding:0 24px;border-radius:24px;box-shadow:inset 0 0 0 1px var(--card-border);
      display:flex;align-items:center;gap:24px}
    .conn-row.connected{justify-content:space-between}
    .conn-left{display:flex;align-items:center;gap:24px}
    .conn-logo{width:46px;height:48px;object-fit:cover;flex:none}
    .conn-logo-apple{display:flex;align-items:center;justify-content:center}
    .conn-logo-sm{width:42.25px;height:40px;flex:none}
    .conn-name{font-family:var(--disp);font-weight:500;font-size:14px;line-height:20px;color:#071216;white-space:nowrap}
    .conn-name-ms{width:152px}
    .conn-status{width:121.37px;display:flex;justify-content:flex-end;align-items:center;gap:8px;
      font-family:var(--disp);font-weight:500;font-size:14px;line-height:20px;color:#071216}
    .conn-status[hidden]{display:none}
    .conn-status .dot{width:8px;height:8px;border-radius:50%;background:#3FDD09;flex:none}
    .conn-status.expired .dot{background:#E37400}          /* conectado, mas reconectar: expirada ou sem permissão */
    .card-sub button.lnk{border:0;background:none;padding:0;font:inherit;color:#0B57D0;cursor:pointer;text-decoration:underline}

    /* botão (973:6642): h 64, padding 16 48, gap 8, raio 999 */
    .int-btn{align-self:flex-start;height:64px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:16px 48px;border:0;background:none;border-radius:999px;box-shadow:inset 0 0 0 1px var(--card-border);
      cursor:pointer;font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.01em;color:#000}
    .int-btn:hover{background:var(--active)}
    .int-btn[disabled]{opacity:.45;cursor:not-allowed;background:none}
  </style>
</head>

  <script>
    // itens do menu que levam a outra tela (data-href: a política de segurança não aceita onclick no HTML)
    document.querySelectorAll('[data-href]').forEach(function (el) {
      el.addEventListener('click', function () { location.href = el.getAttribute('data-href'); });
    });
    // menu lateral: recolher / abrir (lembra a escolha entre as telas)
    (function () {
      var nav = document.querySelector('.nav'), t = document.getElementById('navToggle');
      if (!nav || !t) return;
      function setNav(c) {
        nav.classList.toggle('collapsed', c);
        t.title = c ? 'Abrir menu' : 'Recolher menu'; t.setAttribute('aria-label', t.title);
        try { localStorage.setItem('od_nav_collapsed', c ? '1' : '0'); } catch (_) {}
      }
      t.addEventListener('click', function () { setNav(!nav.classList.contains('collapsed')); });
      var saved = '0'; try { saved = localStorage.getItem('od_nav_collapsed') || '0'; } catch (_) {}
      if (saved === '1') setNav(true);
    })();
  </script>
  <script>
    (function () {
      var CFG = {};
      var LOGGED_IN = false;
      var MSG = {};                          // mensagem de falha da última conexão, por provedor (fica até recarregar)

      function render(st) {
        var provs = st.providers || {};
        ['google', 'microsoft'].forEach(function (prov) {
          var card = document.querySelector('.int-card[data-provider="' + prov + '"]');
          if (!card) return;
          var info = provs[prov] || {};
          CFG[prov] = info.configured !== false;
          var row = card.querySelector('.conn-row');
          var status = card.querySelector('.conn-status');
          var btn = card.querySelector('.int-btn');
          var sub = card.querySelector('.card-sub');
          if (!sub.dataset.base) sub.dataset.base = sub.textContent;
          if (!MSG[prov]) sub.textContent = sub.dataset.base;
          status.classList.toggle('expired', !!(info.connected && info.needs_reconnect));
          if (info.connected && info.needs_reconnect) {
            // a conexão morreu (acesso revogado ou vencido) ou foi gravada sem a permissão da agenda: conectar de
            // novo grava um token novo; quem não quer mais a agenda ligada ainda pode desconectar
            var perm = info.reason === 'permissao';
            row.classList.add('connected');
            status.hidden = false;
            status.querySelector('.st-text').textContent = perm ? 'Sem permissão' : 'Expirada';
            btn.textContent = 'Reconectar';
            btn.dataset.action = 'connect';
            if (!MSG[prov]) {
              sub.textContent = perm ? 'Falta a permissão da agenda. Reconecte e marque a permissão do Google Agenda, ou '
                : 'A conexão expirou. Reconecte ou ';
              var off = document.createElement('button'); off.type = 'button'; off.className = 'lnk'; off.textContent = 'desconecte';
              off.addEventListener('click', function () { fetch('/integrations/' + prov + '/disconnect', { method: 'POST' }).then(load); });
              sub.appendChild(off); sub.appendChild(document.createTextNode('.'));
            }
          } else if (info.connected) {
            row.classList.add('connected');
            status.hidden = false;
            status.querySelector('.st-text').textContent = 'Conectado';
            btn.textContent = 'Desconectar';
            btn.dataset.action = 'disconnect';
          } else {
            row.classList.remove('connected');
            status.hidden = true;
            btn.dataset.action = 'connect';
            if (!LOGGED_IN && prov === 'google') {
              btn.textContent = 'Entrar com Google';
            } else {
              btn.textContent = 'Conectar';
            }
          }
        });
      }

      function load() {
        fetch('/integrations/status').then(function (r) { return r.json(); })
          .then(function (st) {
            LOGGED_IN = !!st.logged_in;
            render(st);
          }).catch(function () {});
      }

      document.querySelectorAll('.int-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var prov = btn.dataset.provider;
          if (btn.disabled) return;          // Outlook: desabilitado por ora
          if (btn.dataset.action === 'disconnect') {
            fetch('/integrations/' + prov + '/disconnect', { method: 'POST' }).then(load);
          } else if (!LOGGED_IN) {
            location.href = '/opendoctor-login.html?next=' + encodeURIComponent('/opendoctor-integracao.html');
          } else {
            location.href = '/integrations/' + prov + '/connect';
          }
        });
      });

      // feedback dos redirects de callback: a conexão que falhou diz o porquê no próprio cartão
      var qs = new URLSearchParams(location.search);
      if (qs.get('conectado')) {
        history.replaceState({}, '', location.pathname);
      } else if (qs.get('erro')) {
        var erro = qs.get('erro'), alvo = erro === 'microsoft' ? 'microsoft' : 'google';
        MSG[alvo] = erro === 'sessao' ? 'A conexão não foi concluída neste navegador. Tente de novo.'
          : erro === 'permissao' ? 'Marque a permissão do Google Agenda e tente de novo.'
          : erro === 'access_denied' ? 'Conexão cancelada.' : 'Não foi possível conectar. Tente de novo.';
        var c = document.querySelector('.int-card[data-provider="' + alvo + '"] .card-sub');
        if (c) { c.dataset.base = c.dataset.base || c.textContent; c.textContent = MSG[alvo]; }
        history.replaceState({}, '', location.pathname);
      }

      load();
    })();
  </script>
