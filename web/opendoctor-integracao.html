    <!-- ===== CENTER: INTEGRAÇÃO ===== -->
    <div class="center">
      <div class="int">
        <div class="loginbar" id="loginbar" hidden></div>
        <div class="int-title">Integração</div>

        <!-- Card: Google Calendar -->
        <div class="int-card" data-provider="google">
          <div class="card-head">
            <div class="card-name">Google Calendar</div>
            <div class="card-sub">Conecte seu calendário</div>
          </div>
          <div class="conn-row">
            <div class="conn-left">
              <img class="conn-logo" src="assets/int/google-calendar.png" alt="Google Calendar">
              <span class="conn-name">Google Calendar</span>
            </div>
            <div class="conn-status" hidden><span class="dot"></span><span class="st-text">Conectado</span></div>
          </div>
          <button class="int-btn" data-provider="google">Conectar</button>
        </div>

        <!-- Card: Microsoft Outlook -->
        <div class="int-card" data-provider="microsoft">
          <div class="card-head">
            <div class="card-name">Microsoft Outlook</div>
            <div class="card-sub">Conecte seu calendário</div>
          </div>
          <div class="conn-row">
            <div class="conn-left">
              <img class="conn-logo-sm" src="assets/int/outlook.svg" alt="Microsoft Outlook">
              <span class="conn-name">Microsoft Outlook</span>
            </div>
            <div class="conn-status" hidden><span class="dot"></span><span class="st-text">Conectado</span></div>
          </div>
          <button class="int-btn" data-provider="microsoft">Conectar</button>
        </div>
      </div>
    </div>

  </div>
  <script>
    (function () {
      var CFG = {};
      var LOGGED_IN = false;

      function renderLogin(st, user) {
        var bar = document.getElementById('loginbar');
        bar.hidden = false;
        if (st.logged_in && user) {
          var who = user.name || user.email || 'conta Google';
          bar.innerHTML = '<span class="lb-msg">Logado como <span class="lb-user"></span></span>' +
                          '<a class="lb-link" href="/auth/logout">Sair</a>';
          bar.querySelector('.lb-user').textContent = who;
        } else {
          bar.innerHTML = '<span class="lb-msg">Entre com sua conta Google para conectar um calendário.</span>' +
                          '<a class="lb-btn" href="/auth/google/login">Entrar com Google</a>';
        }
      }

      function render(st) {
        var provs = st.providers || {};
        ['google', 'microsoft'].forEach(function (prov) {
          var card = document.querySelector('.int-card[data-provider="' + prov + '"]');
          if (!card) return;
          var info = provs[prov] || {};
          CFG[prov] = info.configured !== false;
          var row = card.querySelector('.conn-row');
          var status = card.querySelector('.conn-status');
          var btn = card.querySelector('.int-btn');
          btn.disabled = false;
          if (info.connected) {
            row.classList.add('connected');
            status.hidden = false;
            status.querySelector('.st-text').textContent = info.email || 'Conectado';
            btn.textContent = 'Desconectar';
            btn.dataset.action = 'disconnect';
          } else {
            row.classList.remove('connected');
            status.hidden = true;
            btn.dataset.action = 'connect';
            if (!LOGGED_IN) {
              btn.textContent = 'Entrar com Google';
              btn.title = 'Faça login para conectar';
            } else if (CFG[prov] === false) {
              btn.textContent = 'Indisponível';
              btn.disabled = true;
              btn.title = 'Credenciais do provedor ainda não configuradas';
            } else {
              btn.textContent = 'Conectar';
              btn.title = '';
            }
          }
        });
      }

      function load() {
        Promise.all([
          fetch('/integrations/status').then(function (r) { return r.json(); }),
          fetch('/me').then(function (r) { return r.json(); })
        ]).then(function (res) {
          var st = res[0], me = res[1];
          LOGGED_IN = !!st.logged_in;
          renderLogin(st, me && me.user);
          render(st);
        }).catch(function () {});
      }

      document.querySelectorAll('.int-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var prov = btn.dataset.provider;
          if (btn.disabled) return;
          if (btn.dataset.action === 'disconnect') {
            fetch('/integrations/' + prov + '/disconnect', { method: 'POST' }).then(load);
          } else if (!LOGGED_IN) {
            location.href = '/auth/google/login';
          } else {
            location.href = '/integrations/' + prov + '/connect';
          }
        });
      });

      // feedback dos redirects de callback
      var qs = new URLSearchParams(location.search);
      if (qs.get('conectado')) {
        history.replaceState({}, '', location.pathname);
      } else if (qs.get('erro')) {
        history.replaceState({}, '', location.pathname);
      }

      load();
    })();
  </script>
